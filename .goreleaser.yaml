version: 2

project_name: mm

before:
  hooks:
    - go mod tidy

builds:
  - id: mm
    main: ./cmd/mm
    binary: mm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: mm
    name_template: "mm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

brews:
  - name: mm
    repository:
      owner: ayusavin
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/ayusavin/mattermost-cli"
    description: "Mattermost CLI for humans and agents"
    license: "MIT"
    install: |
      bin.install "mm"
      generate_completions_from_executable(bin/"mm", "completion")
    test: |
      system "#{bin}/mm", "--version"

release:
  github:
    owner: ayusavin
    name: mattermost-cli
  draft: false
  prerelease: auto
